services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-extractor-api:latest
    container_name: content-extractor-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LINKEDIN_USER_DATA_DIR: /home/appuser/.linkedin_browser_profile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
