services:
  - type: web
    name: content-extractor-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: YOUTUBE_DEFAULT_LANGUAGES
        value: '["en","bn","hi"]'
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO